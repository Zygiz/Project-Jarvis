services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - jarvis_db_data:/var/lib/postgresql/data

  api:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - db

  bot:
    build: .
    env_file: .env
    volumes:
      - .:/app
    command: python -m app.bot
    depends_on:
      - db
    restart: unless-stopped

volumes:
  jarvis_db_data: